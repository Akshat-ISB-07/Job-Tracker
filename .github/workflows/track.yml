name: Job Tracker

on:
  schedule:
    # Runs every 6 hours (cron is UTC). Adjust to taste.
    # Examples:
    #   "0 */6 * * *"  → every 6 hours
    #   "0 9,17 * * *" → 9 AM and 5 PM UTC daily
    #   "0 9 * * 1-5"  → weekdays at 9 AM UTC
    - cron: "0 */6 * * *"

  # Also lets you trigger a run manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    # Allow the job to commit seen_jobs.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tracker
        env:
          GMAIL_USER:   ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:   ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python tracker.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update seen_jobs [skip ci]"
          git push
